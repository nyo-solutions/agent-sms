name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  aws:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: aws } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: aws/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npx tsc --noEmit
      - name: Synth with a dummy secret
        run: SMS_WEBHOOK_SECRET=$(head -c 24 /dev/urandom | base64) CDK_DEFAULT_ACCOUNT=111111111111 npx cdk synth AgentSms -q
  mcp:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mcp } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mcp/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm test
